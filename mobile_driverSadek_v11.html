<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>L'appli de tri a changé d'adresse</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1216;color:#eee;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
a{color:#f0b429;font-weight:700}
.w{max-width:420px}
h1{font-size:20px}
#s{font-weight:700;color:#f0b429}
#o{font-size:12px;opacity:.7;margin-top:18px}
</style>
</head>
<body>
<div class="w">
<h1>L'appli de tri a changé d'adresse</h1>
<p id="m">Vérification des scans en attente…</p>
<p id="s"></p>
<p id="o" style="display:none"><a href="#" id="forcer">Ouvrir quand même la nouvelle appli</a></p>
<noscript><p><a href="https://msgestion.app/appli_tri.html">Ouvrir la nouvelle appli</a></p></noscript>
</div>
<script>
// Redirection vers la nouvelle appli de tri. AVANT de partir, on envoie les scans restés dans la mémoire de ce téléphone
// (file d'attente et session de l'ancienne appli) : la nouvelle adresse a son propre stockage et ne les verrait jamais.
// Même envoi que l'appli : fonction insert_scans, qui ignore les lignes déjà reçues (aucun doublon possible).
(function(){
  var CIBLE='https://msgestion.app/appli_tri.html';
  var SUPA_URL='https://kctgcckyqlmlgenzfwun.supabase.co', SUPA_KEY='sb_publishable_uwMTvjp_ozu4QIKpmKdqLA_oIyAPBgR';
  var LS_Q='driverQueue_v1', LS_S='driverSession_v1', LS_REJ='driverQueueRejetes_v1';
  function $(id){return document.getElementById(id);}
  function dest(){return CIBLE+location.search+location.hash;}
  function partir(){location.replace(dest());}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function uid(){try{if(crypto.randomUUID) return crypto.randomUUID();}catch(e){} return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);}
  function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?def:v;}catch(e){return def;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v)); return true;}catch(e){return false;}}

  // Colis de la session pas encore mis en file par l'ancienne appli (même règle que sa fonction syncSession)
  function rattraper(){
    var s=lsGet(LS_S,null); if(!s||!s.scans) return;
    if(!(s.code&&s.workDate&&s.trieur)) return;
    var dev=''; try{dev=localStorage.getItem('driverDeviceId')||'';}catch(e){}
    var q=lsGet(LS_Q,[]); if(!Array.isArray(q)) q=[];
    var have={}; q.forEach(function(x){if(x&&x.r) have[x.r.id]=1;});
    var changed=false;
    function mk(id,kind,tn,adresse,tournee,t,extra){
      var r={id:id,session_code:s.code,work_date:s.workDate,trieur:s.trieur,kind:kind,tn:tn||null,adresse:adresse||null,tournee:tournee||null,
        scanned_at:new Date(t||Date.now()).toISOString(),device_id:dev};
      if(extra) for(var k in extra) r[k]=extra[k];
      return r;
    }
    Object.keys(s.scans).forEach(function(tn){
      var e=s.scans[tn];
      if(!e.id){e.id=uid(); changed=true;}
      if(!e.q&&!have[e.id]){q.push({r:mk(e.id,e.known?'tn':'hors',tn,'',e.known?e.tour:'',e.t)}); e.q=1; changed=true;}
      if(!e.known&&(e.adr||e.tour)){
        if(!e.aid){e.aid=uid(); e.at=e.at||Date.now(); changed=true;}
        if(!e.aq&&!have[e.aid]){q.push({r:mk(e.aid,'hors',tn,e.adr,e.tour,e.at,e.plabel?{position_ref:e.pref,position_label:e.plabel}:null)}); e.aq=1; changed=true;}
      }
    });
    Object.keys(s.addrOnly||{}).forEach(function(id){
      var a=s.addrOnly[id];
      if(!a.q&&!have[id]){q.push({r:mk(id,'adr','',a.label,a.tour,a.t)}); a.q=1; changed=true;}
    });
    if(changed){ if(lsSet(LS_Q,q)) lsSet(LS_S,s); }
  }
  function enAttente(){var q=lsGet(LS_Q,[]); return Array.isArray(q)?q.filter(function(x){return x&&x.r&&!x.rej;}):[];}
  function retirer(items,vers){
    var ids={}; items.forEach(function(x){ids[x.r.id]=1;});
    var q=lsGet(LS_Q,[]).filter(function(x){return !(x&&x.r&&ids[x.r.id]);});
    lsSet(LS_Q,q);
    if(vers){var rej=lsGet(LS_REJ,[]); items.forEach(function(x){rej.push({r:x.r,rej:vers});}); lsSet(LS_REJ,rej);}
  }
  // Résultat : ok · dup (déjà reçu) · retry (réseau, accès) · bad (ligne refusée)
  function envoyer(rows){
    var ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},20000);
    return fetch(SUPA_URL+'/rest/v1/rpc/insert_scans',{method:'POST',signal:ctl.signal,
      headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({rows:rows})})
    .then(function(resp){
      clearTimeout(tm);
      if(resp.ok) return {s:'ok'};
      return resp.json().catch(function(){return {};}).then(function(j){
        var code=j.code||'', st=resp.status;
        if(code==='23505') return {s:'dup'};
        if(st===401||st===403) return {s:'retry'};
        if(!st||st===408||st===429||st>=500) return {s:'retry'};
        return {s:'bad',msg:(code?code+' ':'')+(j.message||('erreur '+st))};
      });
    },function(){clearTimeout(tm); return {s:'retry'};});
  }
  async function vider(){
    for(;;){
      var q=enAttente(); if(!q.length) return 'ok';
      var batch=q.slice(0,100), res=await envoyer(batch.map(function(x){return x.r;}));
      if(res.s==='ok'){retirer(batch); continue;}
      if(res.s==='dup'||res.s==='bad'){
        for(var i=0;i<batch.length;i++){
          res=await envoyer([batch[i].r]);
          if(res.s==='ok'||res.s==='dup') retirer([batch[i]]);
          else if(res.s==='bad') retirer([batch[i]],res.msg);
          else return 'retry';
        }
        continue;
      }
      return 'retry';
    }
  }
  async function main(){
    try{ rattraper(); }catch(e){}
    var n=enAttente().length;
    if(!n){ partir(); return; }
    $('m').textContent=n+' scan'+(n>1?'s':'')+' à envoyer avant de continuer…';
    $('forcer').addEventListener('click',function(ev){
      ev.preventDefault();
      if(confirm(enAttente().length+' scan(s) ne sont pas encore envoyés et resteraient dans l\'ancienne appli.\n\nContinuer quand même ?')) partir();
    });
    for(;;){
      var r=await vider();
      if(r==='ok'){ $('m').textContent='Scans envoyés. Ouverture de la nouvelle appli…'; $('s').textContent=''; partir(); return; }
      $('m').textContent=enAttente().length+' scan(s) pas encore envoyés.';
      $('s').textContent='Pas de réseau : gardez cette page ouverte, nouvel essai automatique.';
      $('o').style.display='block';
      await sleep(5000);
    }
  }
  main();
})();
</script>
</body>
</html>
